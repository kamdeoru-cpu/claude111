<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" width="640" height="200" role="img" aria-labelledby="t d">
  <title id="t">Все объявления — логотип</title>
  <desc id="d">Бумажное объявление с отрывными листочками; один листочек уже оторвали</desc>
  <!-- Цвета: #152238 (тёмно-синий), #FF6B00 (оранжевый) -->

  <!-- Знак -->
  <g transform="translate(24 22)">
    <!-- лист объявления -->
    <rect x="0" y="12" width="118" height="84" rx="10" fill="#152238"/>
    <!-- строки текста -->
    <rect x="18" y="36" width="64" height="10" rx="5" fill="#FFFFFF"/>
    <rect x="18" y="56" width="82" height="10" rx="5" fill="#FFFFFF"/>
    <!-- кнопка-гвоздик -->
    <circle cx="59" cy="12" r="11" fill="#FF6B00"/>
    <!-- отрывные листочки -->
    <rect x="0"   y="102" width="19" height="52" rx="4" fill="#152238"/>
    <rect x="24.75" y="102" width="19" height="52" rx="4" fill="#152238"/>
    <rect x="74.25" y="102" width="19" height="52" rx="4" fill="#152238"/>
    <rect x="99"  y="102" width="19" height="52" rx="4" fill="#152238"/>
    <!-- оторванный листочек -->
    <rect x="49.5" y="102" width="19" height="52" rx="4" fill="#FF6B00" transform="translate(78 16) rotate(18 59 128)"/>
  </g>

  <!-- Словесный знак -->
  <g font-family="'Montserrat','Helvetica Neue',Arial,sans-serif" font-weight="800" fill="#152238">
    <text x="196" y="92" font-size="56" letter-spacing="-1">Все</text>
    <text x="196" y="152" font-size="56" letter-spacing="-1">объявления<tspan fill="#FF6B00">.рф</tspan></text>
  </g>
</svg>
