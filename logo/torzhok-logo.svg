<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-labelledby="t d">
  <title id="t">Торжок — логотип</title>
  <desc id="d">Ценник, внутри которого две стрелки обмена: вещь переходит из рук в руки</desc>
  <defs>
    <linearGradient id="tagGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF4D6D"/>
      <stop offset="0.55" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B1F3B"/>
      <stop offset="1" stop-color="#3A2F6B"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#FF4D6D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Знак: ценник с петлёй обмена -->
  <g transform="translate(40 30)">
    <g transform="rotate(-45 80 84)" filter="url(#shadow)">
      <!-- тело ценника; толстая обводка того же цвета скругляет углы -->
      <path d="M80 12 L124 50 L124 150 L36 150 L36 50 Z"
            fill="url(#tagGrad)" stroke="url(#tagGrad)" stroke-width="18" stroke-linejoin="round"/>
      <!-- отверстие ценника -->
      <circle cx="80" cy="42" r="10" fill="#FFFFFF"/>
      <!-- петля обмена -->
      <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
        <path d="M52.4 97.1 A28 28 0 0 1 104.25 88"/>
        <polyline points="106.04 73.11 104.25 88 90.46 82.11"/>
        <path d="M107.6 106.9 A28 28 0 0 1 55.75 116"/>
        <polyline points="53.96 130.89 55.75 116 69.54 121.89"/>
      </g>
    </g>
    <!-- искры «суперсделки» -->
    <path d="M168 8 l4.5 11 11 4.5 -11 4.5 -4.5 11 -4.5 -11 -11 -4.5 11 -4.5 Z" fill="#00C2A8"/>
    <circle cx="186" cy="52" r="5" fill="#7B61FF"/>
  </g>

  <!-- Словесный знак -->
  <text x="248" y="128" font-family="'Nunito','Montserrat','Arial Rounded MT Bold','Helvetica Neue',Arial,sans-serif"
        font-size="84" font-weight="900" letter-spacing="-2" fill="url(#textGrad)">торж<tspan fill="url(#tagGrad)">о</tspan>к</text>
  <text x="252" y="170" font-family="'Nunito','Montserrat','Helvetica Neue',Arial,sans-serif"
        font-size="19" font-weight="700" letter-spacing="3" fill="#8A8FB0">ПРОДАЙ · ОБМЕНЯЙ · НАЙДИ</text>
</svg>
