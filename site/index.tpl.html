.stub { max-width: 1320px; margin: 0 auto; padding: 28px clamp(14px, 3vw, 32px) 80px; }
.stub__hello { display: block; margin-bottom: 24px; padding: 16px 20px; border-radius: 22px 22px 22px 6px; background: #F4F5F7; color: #3A3F4A; font-weight: 600; font-size: 15px; }

.qa button { font: inherit; color: #fff; background: rgba(255, 255, 255, .12); border: 0; border-radius: 999px; padding: 7px 11px; cursor: pointer; }
.qa button:hover { background: #FF4F3A; }
@media (max-width: 520px) { .qa span { display: none; } }
