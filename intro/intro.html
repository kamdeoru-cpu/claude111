<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Все объявления — интро</title>
<style>
  :root { --ink: #16181D; --accent: #FF4F3A; --paper: #FFFFFF; --muted: #8A8F99; --line: #E6E8EC; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  #intro { flex: 1; min-height: 0; position: relative; background: var(--paper); cursor: pointer; transition: opacity .4s ease; }
  #intro.site { position: fixed; inset: 0; z-index: 9999; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #scene, #bg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .bar button { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .bar button:hover { border-color: var(--ink); }
  .bar button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rates { display: flex; gap: 6px; }
  .scrub { flex: 1 1 220px; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6ch; }
</style>
</head>
<body>
<div id="intro" title="Нажмите, чтобы проиграть заново">
  <canvas id="bg" aria-hidden="true"></canvas>
  <svg id="scene" viewBox="-63 -90 760 394" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Все объявления">
    <defs>
      <clipPath id="cA"><circle id="rA" cx="5" cy="43" r="0"/></clipPath>
      <clipPath id="cB"><circle id="rB" cx="5" cy="141" r="0"/></clipPath>
      <clipPath id="cL0"><rect x="150" y="10" width="560" height="84"/></clipPath>
      <clipPath id="cL1"><rect x="150" y="104" width="560" height="84"/></clipPath>
    </defs>
    <g id="waves" fill="none" stroke-linecap="round"></g>
    <g id="word" fill="#16181D">
      <g id="L0" clip-path="url(#cL0)"></g>
      <g id="L1" clip-path="url(#cL1)"></g>
    </g>
    <g id="mark">
      <g stroke-linejoin="round" stroke-width="10" transform="translate(20 4)">
        <rect id="sA" x="0" y="0" width="10" height="86" rx="5" fill="#FF4F3A"/>
        <rect id="sB" x="0" y="92" width="10" height="120" rx="5" fill="#16181D"/>
        <path id="tail" d="M30 185 L5 207 L5 185 Z" fill="#16181D" stroke="#16181D"/>
        <path d="M5 97 H84 A44 44 0 0 1 84 185 H5 Z" fill="#16181D" stroke="#16181D" clip-path="url(#cB)"/>
        <path d="M5 5 H78 A38 38 0 0 1 78 81 H5 Z" fill="#FF4F3A" stroke="#FF4F3A" clip-path="url(#cA)"/>
      </g>
    </g>
  </svg>
</div>
<div class="bar" id="bar">
  <button id="play">Повторить</button>
  <div class="rates" role="group" aria-label="Скорость">
    <button data-rate="0.25" aria-pressed="false">0.25×</button>
    <button data-rate="0.5" aria-pressed="false">0.5×</button>
    <button data-rate="1" aria-pressed="true">1×</button>
  </div>
  <div class="scrub"><input type="range" id="scrub" min="0" step="0.001" value="0" aria-label="Таймлайн"><span class="time" id="time">0.00 с</span></div>
</div>

      const r = 8 + WAVE_R * outCubic(p), cy = SRC[w.s].cy;
      w.n.setAttribute("d", `M25 ${cy - r} A${r} ${r} 0 0 1 25 ${cy + r}`);
      w.n.setAttribute("stroke-width", mix(9, 1.5, p));
      w.n.setAttribute("opacity", Math.pow(1 - p, 1.6));
    }

    // заливка чаш — «пойманная» волна
    rA.setAttribute("r", 150 * outBack(seg(t, ...T.fillA), 1.2));
    rB.setAttribute("r", 150 * outBack(seg(t, ...T.fillB), 1.2));

    // хвостик щёлкает последним
    const pt = outBack(seg(t, ...T.tail), 3);
    tail.setAttribute("transform", `translate(5 185) scale(${pt}) translate(-5 -185)`);
    tail.style.display = pt > 0 ? "" : "none";

    // толчок + отъезд влево
    const d = t - T.thump;
    const k = d > 0 ? 1 + .05 * Math.exp(-d * 10) * Math.sin(d * 30) : 1;
    const dx = (CX - MARK_CX) * (1 - inOutQuint(seg(t, ...T.slide)));
    mark.setAttribute("transform", `translate(${dx} 0) translate(${MARK_CX} 110) scale(${k}) translate(${-MARK_CX} -110)`);
    wavesG.setAttribute("transform", `translate(${dx} 0)`);

    // надпись поднимается из-под строки
    for (const g of letters) {
      const s = T.word + (g.x - 170) / 470 * .32 + g.l * .07;
      const e = outExpo(seg(t, s, s + .5));
      g.n.setAttribute("transform", `translate(0 ${(1 - e) * 86})`);
    }

    drawBg(t, dx);
    scrub.value = t; timeEl.textContent = t.toFixed(2) + " с";
  }

  /* ---------- плеер ---------- */
  const scrub = $("scrub"), timeEl = $("time"), playBtn = $("play");
  scrub.max = TOTAL;
  let t = 0, rate = 1, raf = 0, last = 0, playing = false;
  function finish() {
    playing = false; playBtn.textContent = "Повторить";
    if (SITE_MODE) setTimeout(() => {
      intro.classList.add("gone");
      setTimeout(() => { intro.remove(); window.dispatchEvent(new Event("intro:done")); }, 420);
    }, 250);
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    t = Math.min(TOTAL, t + dt * rate); render(t);
    if (t < TOTAL) raf = requestAnimationFrame(frame); else finish();
  }
  function play(from) {
    cancelAnimationFrame(raf); if (from !== undefined) t = from; if (t >= TOTAL) t = 0;
    playing = true; playBtn.textContent = "Пауза"; last = performance.now(); raf = requestAnimationFrame(frame);
  }
  function pause() { cancelAnimationFrame(raf); playing = false; playBtn.textContent = t >= TOTAL ? "Повторить" : "Играть"; }

  if (SITE_MODE) {
    $("bar").remove(); intro.classList.add("site"); intro.removeAttribute("title");
    intro.addEventListener("click", () => { cancelAnimationFrame(raf); t = TOTAL; render(t); finish(); });
  } else {
    intro.addEventListener("click", () => play(0));
    playBtn.addEventListener("click", () => playing ? pause() : play(t >= TOTAL ? 0 : undefined));
    scrub.addEventListener("input", () => { pause(); t = +scrub.value; render(t); });
    document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => {
      rate = +b.dataset.rate; document.querySelectorAll("[data-rate]").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(t >= TOTAL ? 0 : undefined); } });
  }

  new ResizeObserver(layout).observe(intro);
  layout();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const still = new URLSearchParams(location.search).get("t");
  if (still !== null) { t = +still; render(t); }
  else if (reduce) { t = TOTAL; render(t); finish(); }
  else { render(0); setTimeout(() => play(0), 200); }
})();
</script>
</body>
</html>
