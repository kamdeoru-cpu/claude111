<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Все объявления — интро</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #16181D; --accent: #FF4F3A; --paper: #FFFFFF; --muted: #8A8F99; --line: #E6E8EC; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; display: flex; flex-direction: column; overflow: hidden; }
  #intro { flex: 1; min-height: 0; position: relative; background: var(--paper); cursor: pointer; transition: opacity .45s ease; }
  #intro.site { position: fixed; inset: 0; z-index: 9999; }
  #intro.gone { opacity: 0; pointer-events: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .msg { font-family: "Manrope", "Helvetica Neue", Arial, sans-serif; font-weight: 700; font-size: 21px; fill: #fff; }

  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px 14px; border-top: 1px solid var(--line); font-size: 14px; }
  .bar button { font: inherit; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .bar button:hover { border-color: var(--ink); }
  .bar button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .bar button:focus-visible, .bar input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rates { display: flex; gap: 6px; }
  .scrub { flex: 1 1 220px; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .scrub input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .time { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6ch; }
</style>
</head>
<body>
<div id="intro" title="Нажмите, чтобы проиграть заново">
  <svg id="scene" viewBox="-63 -90 760 394" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Все объявления">
    <g id="world">
      <g id="word" fill="#16181D"></g>
      <g id="ticks" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M0 6 L4 10 L11 1"/><path d="M6 6 L10 10 L17 1"/>
      </g>
      <g id="mark" stroke-linejoin="round" stroke-width="10">
        <path id="bB" fill="#16181D" stroke="#16181D"/>
        <path id="bA" fill="#FF4F3A" stroke="#FF4F3A"/>
      </g>
      <g id="dotsA" fill="#fff"><circle r="4.5"/><circle r="4.5"/><circle r="4.5"/></g>
      <g id="dotsB" fill="#fff"><circle r="4.5"/><circle r="4.5"/><circle r="4.5"/></g>
      <text id="tA" class="msg">Ещё актуально?</text>
      <text id="tB" class="msg">Да, забирайте!</text>
    </g>
  </svg>
</div>
<div class="bar" id="bar">
  <button id="play">Повторить</button>
  <div class="rates" role="group" aria-label="Скорость">
    <button data-rate="0.25" aria-pressed="false">0.25×</button>
    <button data-rate="0.5" aria-pressed="false">0.5×</button>
    <button data-rate="1" aria-pressed="true">1×</button>
  </div>
  <div class="scrub"><input type="range" id="scrub" min="0" step="0.001" value="0" aria-label="Таймлайн"><span class="time" id="time">0.00 с</span></div>
</div>

      const p = outCubic(seg(t, ...win));
      n.setAttribute("x", box.x + PAD); n.setAttribute("y", box.y + box.h / 2 + 7.5 + (1 - p) * 6);
      n.setAttribute("opacity", p * hush);
    };
    txt(tA, chatA, T.textA); txt(tB, chatB, T.textB);

    // галочки «прочитано»
    const tk = outCubic(seg(t, T.tick, T.tick + .25));
    ticks.setAttribute("transform", `translate(${RIGHT - 17} ${cyA + hA / 2 + 10 + (1 - tk) * 4})`);
    ticks.setAttribute("opacity", tk * hush);
    ticks.setAttribute("stroke", mixHex("#B9BDC6", "#FF4F3A", seg(t, T.read, T.read + .2)));

    // щелчок сборки: знак чуть сжимается и отпружинивает
    const ds = t - T.snap;
    const k = ds > 0 ? 1 - .045 * Math.exp(-ds * 9) * Math.sin(ds * 24) : 1;
    mark.setAttribute("transform", `translate(${MC.x} ${MC.y}) scale(${k}) translate(${-MC.x} ${-MC.y})`);

    // надпись выходит из-за знака слева направо
    for (const g of letters) {
      const d = T.word + (g.x - 170) / 470 * .55 + g.l * .06;
      const p = seg(t, d, d + .5), e = outCubic(p);
      g.n.setAttribute("transform", `translate(${-26 * (1 - e)} ${10 * (1 - e)})`);
      g.n.setAttribute("opacity", clamp(p * 2.2));
    }

    scrub.value = t; timeEl.textContent = t.toFixed(2) + " с";
  }

  /* ---------- плеер ---------- */
  const scrub = $("scrub"), timeEl = $("time"), playBtn = $("play");
  scrub.max = TOTAL;
  let t = 0, rate = 1, raf = 0, last = 0, playing = false;
  function finish() {
    playing = false; playBtn.textContent = "Повторить";
    if (SITE_MODE) {
      setTimeout(() => {
        intro.classList.add("gone");
        setTimeout(() => { intro.remove(); window.dispatchEvent(new Event("intro:done")); }, 480);
      }, 350);
    }
  }
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    t = Math.min(TOTAL, t + dt * rate); render(t);
    if (t < TOTAL) raf = requestAnimationFrame(frame); else finish();
  }
  function play(from) {
    cancelAnimationFrame(raf); if (from !== undefined) t = from; if (t >= TOTAL) t = 0;
    playing = true; playBtn.textContent = "Пауза"; last = performance.now(); raf = requestAnimationFrame(frame);
  }
  function pause() { cancelAnimationFrame(raf); playing = false; playBtn.textContent = t >= TOTAL ? "Повторить" : "Играть"; }

  if (SITE_MODE) {
    $("bar").remove(); intro.classList.add("site"); intro.removeAttribute("title");
    intro.addEventListener("click", () => { cancelAnimationFrame(raf); t = TOTAL; render(t); finish(); });
  } else {
    intro.addEventListener("click", () => play(0));
    playBtn.addEventListener("click", () => playing ? pause() : play(t >= TOTAL ? 0 : undefined));
    scrub.addEventListener("input", () => { pause(); t = +scrub.value; render(t); });
    document.querySelectorAll("[data-rate]").forEach(b => b.addEventListener("click", () => {
      rate = +b.dataset.rate; document.querySelectorAll("[data-rate]").forEach(x => x.setAttribute("aria-pressed", x === b));
    }));
    addEventListener("keydown", e => { if (e.code === "Space") { e.preventDefault(); playing ? pause() : play(t >= TOTAL ? 0 : undefined); } });
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  measure(); render(reduce ? TOTAL : 0);
  const ready = document.fonts ? document.fonts.load('700 21px Manrope') : Promise.resolve();
  const still = new URLSearchParams(location.search).get("t");
  const go = () => { measure(); if (still !== null) { pause(); t = +still; render(t); return; } if (reduce) { t = TOTAL; render(t); finish(); } else setTimeout(() => play(0), 250); };
  ready.then(go, go);
})();
</script>
</body>
</html>
